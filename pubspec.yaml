name: rotas_campo
description: "Porteira sem fronteiras — gestão de equipe de campo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  supabase_flutter: ^2.17.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  pdf: ^3.13.1
  printing: ^5.15.1
  http: ^1.6.0
  geolocator: ^14.0.1
  fl_chart: ^1.2.0
  google_mlkit_text_recognition: ^0.17.1
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Assets do app (logo usado na splash, no menu e nos relatórios)
  assets:
    - assets/logo.png
    - assets/menino_ia.png

# ---- Ícone do app (UM único bloco) ----
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"

# ---- Splash nativa (tela que aparece antes do Flutter carregar) ----
flutter_native_splash:
  color: "#167A3C"
  image: assets/logo.png
  android_12:
    color: "#167A3C"
    image: assets/logo.png